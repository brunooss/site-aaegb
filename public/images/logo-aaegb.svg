<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#174f3f"/>
      <stop offset="100%" stop-color="#071f17"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c765"/>
      <stop offset="100%" stop-color="#e9af3f"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="92" fill="url(#logo-grad)" stroke="#e9af3f" stroke-width="4"/>
  
  <!-- Rays / Sun rays -->
  <g fill="none" stroke="#e9af3f" stroke-width="2.5" opacity="0.6">
    <line x1="100" y1="28" x2="100" y2="40" />
    <line x1="150" y1="48" x2="142" y2="57" />
    <line x1="172" y1="98" x2="160" y2="98" />
    <line x1="50" y1="48" x2="58" y2="57" />
    <line x1="28" y1="98" x2="40" y2="98" />
  </g>

  <!-- Sun Circle -->
  <circle cx="100" cy="72" r="26" fill="url(#gold-grad)"/>

  <!-- Open Book Symbol -->
  <path d="M 45 125 C 68 112, 92 115, 100 128 C 108 115, 132 112, 155 125 L 155 156 C 132 143, 108 146, 100 158 C 92 146, 68 143, 45 156 Z" fill="#ffffff" />
  <path d="M 100 128 L 100 158" stroke="#174f3f" stroke-width="3" stroke-linecap="round"/>

  <!-- Star of Guinea Bissau / Hope -->
  <polygon points="100,52 103,60 112,60 105,65 107,73 100,68 93,73 95,65 88,60 97,60" fill="#c6532d" />
</svg>
